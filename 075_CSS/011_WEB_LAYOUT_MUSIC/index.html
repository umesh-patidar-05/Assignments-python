<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
    }

    body {
        background-image: url(music.webp);
        background-size: cover;
    }

    .box1 {
        width: 95vw;
        margin: auto;
        margin-top: 5px;
        color: white;
        border: 1px dashed white;
        border-radius: 10px;
        height: 48px;
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.541);
    }

    .box1>h2 {
        margin-left: 60px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-weight: bolder;
        text-shadow: 3px 3px 3px skyblue;
    }

    .box2 {
        width: 95vw;
        height: auto;
        margin: auto;
        margin-top: 13px;
        border: 1px dashed white;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.541);
        height: auto;
        padding: 2px 0;
    }

    .box2 > ul {
        list-style: none;
        font-size: 0px;
        height: auto;
        margin: 2px 2px 2px 10px;

    }
    
    .box2 > ul > li {
        display: inline-block;
        height: auto;
        margin-right: 2px;

    }

    .box2 > ul > li > a {
        text-decoration: none;
        color: white;
        font-size: 10px;
        background: rgba(0, 0, 0, 0.671);
        padding: 5px 8px;
        display: inline-block;
        border-radius: 5px;
        border-bottom: 1px solid transparent;

    }

    .box2 > ul > li > a:hover {
        background: rgb(3, 3, 99);
        border-bottom: 1px solid yellow;
        color: yellow;
    }

    .box3 {
        width: 95vw;
        height: 70vh;
        margin: auto;
        border: 1px dashed white;
        margin-top: 13px;
        border-radius: 10px;
        padding: 13px;
        background: rgba(0, 0, 0, 0.541);
    }

    .box3 > h5 {
        color: white;
        border-bottom: 2px solid rgba(255, 255, 255, 0.801);
        padding-bottom: 5px;
    }

    .box4 {
        width: 95vw;
        margin: auto;
        margin-top: 13px;
        background: rgba(0, 0, 0, 0.541);
        color: white;
        border: 1px dashed white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;
    }

    .box4 > p {
        padding: 12px 0;
    }

</style>

<body>
    <div class="box1">
        <h2>Music World</h2>
    </div>
    <div class="box2">
        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT US</a></li>
            <li><a href="#">CATEGORY &darr;</a></li>
            <li><a href="#">PRODUCTION</a></li>
            <li><a href="#">GALLERY</a></li>
            <li><a href="#">CONTACT US</a></li>
            <li><a href="#">LOGIN</a></li>
        </ul>
    </div>
    <div class="box3">
        <h5>About Music World</h5>
    </div>
    <div class="box4">
        <p>Copyright © 2023 All RIght Reserved By : Music World ®</p>
    </div>

</body>

</html>
