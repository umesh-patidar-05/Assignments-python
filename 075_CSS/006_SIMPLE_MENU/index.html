<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple menu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .main {
            width: 70%;
            /* height: auto; */
            background: black;
            margin: auto;
            color: white;
            border-bottom: 5px solid rgb(218, 134, 39);
            box-shadow: 2px 2px 5px 2px black;
        }

        ul {
            list-style: none;
            padding: 0px;
            margin: 0;
            font-size: 0;
        }
        
        li {
        display: inline-block;
    }
    
       
          
    a {
        display: inline-block;
            padding: 8px 12px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            border-right: 2px solid white;

        }

        li:hover {
            background: grey;
        }
    </style>

</head>

<body>
    <div class="main">
        <ul>
            <li>
                <a href="#">Home</a>
            </li>
            <li>
                <a href="#">About</a>
            </li>
            <li>
                <a href="#">Product</a>
            </li>
            <li>
                <a href="#">Services</a>
            </li>
            <li>
                <a href="#">Contact</a>
            </li>
            <li>
                <a href="#">Users</a>
            </li>
            <li>
                <a href="#">Login</a>
            </li>
        </ul>
    </div>
</body>
</html>
