<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log-in window</title>
    <style>
        * {
    box-sizing: border-box;
    color: white;
}
        body {
            background-image: url(back.png);
            background-size: cover;
        }
        .main {
				width:480px;
				/* height:360px; */
				background:rgba(0,0,0,.6);
				margin:auto;
				margin-top:100px;
				border-radius:5px;
				color:white;
				padding:50px 50px 35px 50px;
                display: flex;
                flex-direction: column;
                align-items: center;
        }    




        form {
            width: 100%;
        }

        table {
            margin: 15px 0 0 0 ;
            width: 100%;
        }

        th {
            padding-bottom: 25px;
            font-size: 20px;
            font-weight: 800;
        }
        input {

            padding: 10px 5px;
            font-size: 15px;
            margin-bottom: 20px;
            color: rgb(2, 0, 0);

        }



        input[type = "email"] {
            display: block;
            width: 100%;

        }

        
        input[type = "password"] {
            display: block;
            width: 100%;

        }

        button {
            display: block;
            width: 100%;
            background: rgb(228, 147, 25);
            padding: 7px 0;
            font-size: 20px;
        }

        button:hover {
            background: rgb(22, 168, 179);
        }


    </style>
</head>
<body>
    <div class="main">
        <form action="">
            <table>
                <tr>
                    <th>LOGIN WINDOW</th>
                </tr>
                <tr>
                    <td><input type="email" placeholder="Your Email Address"></td>
                </tr>
                <tr>
                    <td><input type="password" name="" id="" placeholder="Your Password"></td>
                </tr>
                <tr>
                    <td>
                    <input type="checkbox" name="" id="agree">
                    <label for="agree">Aggree With</label>
                    <a href="terms.html">Terms & conditions</a>
                    </td>
                </tr>
                <tr>
                    <td>
                    <button type="submit">Login</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
