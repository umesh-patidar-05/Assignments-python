<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
       @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');

        * {
            box-sizing: border-box;
        }
        .main {
            width: 350px;
            height: 550px;
            background: orange;
            margin: auto;
            border: 2px solid red;
            border-radius: 250px 250px  0 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;

        }

        .box {
            width: 100%;
            height: 100px;
            /* background-color: aquamarine; */
            margin: 15px 0;
            padding: 5px 10px;
            display: flex;
            justify-content: center;
            align-items: center;


        }

        p {
            font-family: Archivo, sans-serif;
            font-weight: 900;
            font-size: 40px;
        }

        .b1 {
            margin-top: 140px;
            background-color: rgb(255, 9, 9);
            color: white;
            border: 2px dashed white;
        }

        .b2 {
            background-color: yellow;
            box-shadow: 1px 1px 5px 2px white;
        }

        .b3 {
            background-color:  rgb(18, 105, 18);
            border: 2px dashed white;
            color: yellow;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box b1">
            <p>MCA</p>
        </div>
        <div class="box b2">
            <p>BCA</p>
        </div>
        <div class="box b3">
            <p>BBA</p>
        </div>

    </div>
</body>
</html>
