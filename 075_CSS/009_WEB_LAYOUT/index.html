<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: gray;
        }
        .main {
            width: 65vw;
            height: 90vh;
            background: pink;
            margin: auto;
            margin-top: 5px;
            border: 4px solid green;
            position: relative;
        }
        
        .head {
            width: 100%;
            height: 80px;
            background: orange;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border-bottom: 4px solid green;
        }
        
        .nav {
            width: 100%;
            height: 40px;
            background: rgb(28, 221, 211);
            padding-top: 10px;
            font-size: 0px;
            border-bottom: 4px solid green;
        }
        
        .nav > a {
            text-decoration: none;
            height: auto;
            width: auto;
            background: green;
            margin-left: 3px;
            padding: 5px 7px;
            border-radius: 5px;
            color: white;
            font-size: 12px;

        }

        a:hover {
            background-color: orange;
        } 

        .box {
            width: 280px;
            height: 200px;
            border-radius: 40px;
            background-color: red;
            float: right;
            margin-top: 30px;
            margin-right: 80px;
        }

        .foot {
            width: 100%;
            height: 80px;
            background: black;
            position: absolute;
            bottom: 0;
            border-top: 4px solid green;
        }


    </style>
</head>
<body>
    <div class="main">
        <header>
            <div class="head">
                <h1>Online Exam System</h1>
            </div>
            <div class="nav">
                <a href="#">HOME</a>
                <a href="#">ABOUT US</a>
                <a href="#">COURSES</a>
                <a href="#">EXAM</a>
                <a href="#">LOGIN</a>
                <a href="#">RESULT</a>
            </div>
        </header>

        <main>
            <div class="box"></div>
        </main>
        <footer>
            <div class="foot">

            </div>
        </footer>

    </div>
</body>
</html>
