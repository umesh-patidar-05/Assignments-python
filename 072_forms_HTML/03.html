<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            background-color: rgb(106, 76, 216);
            color: white;
        }

        input {
            background-color: aliceblue;
            color: black;
        }

        select, option {
            color: black;
            background-color: white;
        }

        textarea {
            background-color: aliceblue;
            color: black;
        }
    </style>
</head>

<body>
    <h1>STUDENT REGISTRATION FROM</h1>
    <form action="03.html" method="get">
        <table>
            <tr>
                <td><br><label for="f_name">FIRST NAME</label></td>
                <td><br><input type="text" name="f_name" id="f_name" maxlength="30"></td>
            </tr>
            
            <tr>
                <td><br><label for="l_name">LAST NAME</label></td>
                <td><br><input type="text" name="l_name" id="l_name" maxlength="30"></td>
            </tr>
            <tr>
                <td><br>DATE OF BIRTH</td>
                <td><br>
                    <select name="date">
                        <option>Day:</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>
                    <select name="month">
                        <option>Month:</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>
                    <select name="year">
                        <option>Year</option>
                        <option>2001</option>
                        <option>2002</option>
                        <option>2003</option>
                        <option>2004</option>
                        <option>2005</option>
                        <option>2006</option>
                        <option>2019</option>
                        <option>2020</option>
                        <option>2021</option>
                        <option>2022</option>
                        <option>2023</option>
                        <option>2024</option>
                        <option>2025</option>
                        <option>2026</option>

                    </select>

                </td>
            </tr>
            <tr>
                <td><br><label for="mail">EMAIL ID</label></td>
                <td><br><input type="email" name="mail" id="mail"></td>
            </tr>
            <tr>
                <td><br><label for="mob">MOBILE NUMBER</label></td>
                <td><br><input type="text" name="mob" id="mob" pattern="[0-9]{10}"></td>
            </tr>
            <tr>
                <td><br><label>Gender</label></td>
                <td>
                    <br>
                    <label for="male">Male</label>
                    <input type="radio" name="male" id="male">
                    <label for="female">Female</label>
                    <input type="radio" name="male" id="female">
                </td>
            </tr>
            <tr>
                <td><br><label for="address">ADDRESS</label></td>
                <td><br><textarea name="address" id="address" rows="5" cols="30"></textarea></td>
            </tr>
            <tr>
                <td><br><label for="city">CITY</label></td>
                <td><br><input type="text" name="city" id="city" maxlength="30" pattern="[a-zA-Z]"></td>
            </tr>
            <tr>
                <td><br><label for="pin">PIN CODE</label></td>
                <td><br><input type="text" name="pin" id="pin" pattern="[0-9]{6}"></td>
            </tr>
            <tr>
                <td><br><label for="state">STATE</label></td>
                <td><br><input type="text" name="state" id="state" maxlength="30" pattern="[a-zA-Z]"></td>
            </tr>
            <tr>
                <td><br><label for="country">COUNTRY</label></td>
                <td><br><input type="text" name="country" id="country" placeholder="India"></td>
            </tr>
            <tr>
                <td rowspan="2"><br><label for="">HOBBIES</label></td>
                <td>
                    <br>
                    <label for="drawing">Drawing</label>
                    <input type="checkbox" name="drawing" id="drawing">

                    <label for="singing">Singing</label>
                    <input type="checkbox" name="singing" id="singing">

                    <label for="dancing">Dancing</label>
                    <input type="checkbox" name="dancing" id="dancing">

                    <label for="sketching">Sketching</label>
                    <input type="checkbox" name="sketching" id="sketching">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="others">Others</label>
                    <input type="checkbox" name="others" id="others">
                    <input type="text" name="others" id="">
                </td>
            </tr>
            <tr>
                <td><br>QUALIFICATION</td>
                <td>
                    <br>
                    <table>
                        <tr>
                            <th><label for="">SI.NO.</label></th>
                            <th><label for="">Examination</label></th>
                            <th><label for="">Board</label></th>
                            <th><label for="">Percentage</label></th>
                            <th><label for="">Year of Passing</label></th>
                        </tr>
                        <tr>
                            <td><label for="">1</label></td>
                            <td><label for="">Class X</label></td>
                            <td><input type="text" maxlength="10"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><label for="">2</label></td>
                            <td><label for="">Class XII</label></td>
                            <td><input type="text" maxlength="10"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><label for="">3</label></td>
                            <td><label for="">Graduation</label></td>
                            <td><input type="text" maxlength="10"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                        <tr>
                            <td><label for="">4</label></td>
                            <td><label for="">Masters</label></td>
                            <td><input type="text" maxlength="10"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td><br>COURSES <br>APPLIED FOR</td>
                <td>
                    <br>
                    <label for="bca">BCA</label>
                    <input type="radio" name="course" id="bca">

                    <label for="b_com">B.Com</label>
                    <input type="radio" name="course" id="b_com">

                    <label for="ba">B.A</label>
                    <input type="radio" name="course" id="ba">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <br>
                    <center>
                        <input type="submit" name="" id="" value="Submit">
                        <input type="reset" name="" id="" value="Reset">
                    </center>
                </td>
            </tr>

        </table>
    </form>
</body>

</html>
