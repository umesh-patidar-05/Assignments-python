<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { 
            background-color: rgb(123, 211, 238);
            color: black;
        }
        input {
            background-color: white;
        }
        textarea, select, button {
            background-color: white;
        }

    </style>
</head>
<body>
    <form action="01_lab.png">
        <label for="pass">Enter the password</label>
        <input type="password" name="pass" id="pass" placeholder="***">

        <label for="sur">Enter your surname:</label>
        <input type="text" name="surname" id="sur" placeholder="Sukuru">
        <br><br>

        <label for="address">Address</label>
        <textarea name="address" id="address" rows="5" cols="60" placeholder="Enter ur address"></textarea>
        <br>
        <p>Select the trainning programs attended:</p>
        <input type="checkbox" name="" id="cobol">
        <label for="cobol">COBOL</label>
        <input type="checkbox" name="" id="idms" checked>
        <label for="idms">IDMS</label>
        <input type="checkbox" name="" id="java">
        <label for="java">JAVA</label>
        <br>
        <p>Select the group you belong to: 
            <input type="radio" name="group" id="1">
            <label for="1">Group 1</label>
            <input type="radio" name="group" id="2" checked>
            <label for="2">Group 2</label>
            <input type="radio" name="group" id="3">
            <label for="3">Group 3</label>
            <input type="radio" name="group" id="oth">
            <label for="oth">Others</label>
        </p>
        <p>Which tranning program would you like to attend ?
            <select name="program" id="program">
                <option value="js">JavaScript</option>
                <option value="py">Python</option>
                <option value="java">java</option>
            </select>    
        </p>
        <input type="url" name="" id="">
        <button type="">Browse...</button>
        <br>
        <br>
        <input type="button" name="" id="" value="Exit">
        <button type="submit">Save</button>
        <input type="button" name="" id="" value="Reset">

    </form>

</body>
</html>
