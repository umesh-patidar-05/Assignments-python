<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="03_lab.png">
        <label for="place">Placeholder:</label>
        <input type="text" name="" id="place" pattern="[0-9]" placeholder="Enter Numbers Only">
        <br><br>
        <label for="auto">Autofocus:</label>
        <input type="text" name="" id="auto" autofocus>
        <br><br>
        <label for="range">Range:</label>
        <input type="range" min="0" max="10" step="2">
        <br><br>
        <label for="sea">Search:</label>
        <input type="search" name="" id="sea" placeholder="Search...">
        <br><br>
        <label for="date">Date:</label>
        <input type="date" name="" id="date">        
        <br><br>
        <label for="week">Week:</label>
        <input type="week" name="" id="week">
        <br><br>
        <label for="month">Month:</label>
        <input type="month" name="" id="month">
        <br><br>
        <label for="time">Time:</label>
        <input type="time" name="" id="time">
        <br><br>
        <label for="number">Number:</label>
        <input type="number" name="" id="number">
        <br><br>
        <label for="requ">Required:</label>
        <input type="text" name="" id="requ" required>
        <br><br>
        <label for="mail">Email:</label>
        <input type="email" name="" id="mail">
        <br><br>
        <label for="color">Color:</label>
        <input type="color" name="" id="color">
        <br><br>
        <label for="cou">Country:</label>
        <input type="text" name="" id="cou">
        <br><br>
        <audio src="sample_audio.mp3" controls="controls" muted></audio>
        <br>
        <video src="sample_video.mp4" width="500" height="300" controls="controls" muted></video>
        <br><br>
        <input type="submit" name="" id="">
        <input type="reset" name="" id="">
    </form>
</body>
</html>
